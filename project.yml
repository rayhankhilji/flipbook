name: Flipbook
options:
  bundleIdPrefix: com.flipbook
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FlipbookCore:
    path: Packages/FlipbookCore
  FlipbookDesignSystem:
    path: Packages/FlipbookDesignSystem

targets:
  Flipbook:
    type: application
    platform: macOS
    sources:
      - path: Flipbook
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flipbook.app
        INFOPLIST_FILE: Flipbook/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flipbook/Resources/Flipbook.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: FlipbookCore
      - package: FlipbookDesignSystem

  FlipbookTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FlipbookTests
    dependencies:
      - target: Flipbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flipbook.app.tests

schemes:
  Flipbook:
    build:
      targets:
        Flipbook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlipbookTests
    archive:
      config: Release
